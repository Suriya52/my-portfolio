<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elite Tracker Pro 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; background:#0a0a0a; color:white; }
  .glass { background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); }
  .glow { box-shadow:0 0 20px rgba(99,102,241,0.3); }
  .gradient-border { position:relative; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding:2px; border-radius:1rem; }
  .gradient-border-content { background:#0a0a0a; border-radius:0.9rem; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation:fadeIn 0.3s ease-out; }
  .habit-pill { transition:all 0.3s; cursor:pointer; }
  .habit-pill:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,0.4); }
  .chart-container { position:relative; height:300px; }
  .stat-card { transition:all 0.3s; }
  .stat-card:hover { transform:scale(1.05); }
  .scrollbar-hide::-webkit-scrollbar { display:none; }
  .priority-high { border-left:4px solid #ef4444; }
  .priority-medium { border-left:4px solid #f59e0b; }
  .priority-low { border-left:4px solid #10b981; }
  .custom-checkbox { appearance:none; width:20px; height:20px; border:2px solid #6366f1; border-radius:4px; cursor:pointer; position:relative; }
  .custom-checkbox:checked { background:#6366f1; }
  .custom-checkbox:checked::after { content:'✓'; position:absolute; color:white; font-size:14px; top:-2px; left:2px; }
</style>
</head>
<body class="min-h-screen">

<div class="p-4 md:p-6 max-w-7xl mx-auto">

  <!-- Header with Stats -->
  <div class="glass rounded-2xl p-6 mb-6 fade-in">
    <div class="flex flex-wrap justify-between items-center gap-4">
      <div>
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">Elite Tracker Pro</h1>
        <p class="text-gray-400 mt-1">Your journey to excellence starts here</p>
      </div>
      <div class="flex gap-4 flex-wrap">
        <div class="glass px-6 py-3 rounded-xl text-center stat-card">
          <p class="text-xs text-gray-400">Current Streak</p>
          <p class="text-3xl font-bold text-indigo-400" id="streak">0</p>
          <p class="text-xs text-gray-400">🔥 days</p>
        </div>
        <div class="glass px-6 py-3 rounded-xl text-center stat-card">
          <p class="text-xs text-gray-400">Best Streak</p>
          <p class="text-3xl font-bold text-purple-400" id="bestStreak">0</p>
          <p class="text-xs text-gray-400">🏆 days</p>
        </div>
        <div class="glass px-6 py-3 rounded-xl text-center stat-card">
          <p class="text-xs text-gray-400">Total Score</p>
          <p class="text-3xl font-bold text-pink-400" id="totalScore">0</p>
          <p class="text-xs text-gray-400">⭐ points</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <div class="glass rounded-2xl p-2 mb-6 flex gap-2 flex-wrap">
    <button onclick="changeView('today')" id="btnToday" class="flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 font-semibold transition-all">Today</button>
    <button onclick="changeView('calendar')" id="btnCalendar" class="flex-1 px-4 py-3 rounded-xl bg-transparent text-gray-400 font-semibold transition-all hover:bg-white/5">Calendar</button>
    <button onclick="changeView('analytics')" id="btnAnalytics" class="flex-1 px-4 py-3 rounded-xl bg-transparent text-gray-400 font-semibold transition-all hover:bg-white/5">Analytics</button>
    <button onclick="changeView('insights')" id="btnInsights" class="flex-1 px-4 py-3 rounded-xl bg-transparent text-gray-400 font-semibold transition-all hover:bg-white/5">Insights</button>
  </div>

  <!-- Main App -->
  <div id="app" class="fade-in"></div>

</div>

<script>
const state = {
  view: 'today',
  currentDate: new Date().toISOString().split('T')[0],
  trackedDays: {},
  categories: {},
  habits: {},
  goals: {},
  settings: { theme:'dark', notifications:true }
};

// Data persistence
function loadData() {
  const saved = localStorage.getItem('eliteTrackerPro2026');
  if(saved) {
    const parsed = JSON.parse(saved);
    Object.assign(state, parsed);
  } else {
    // Default categories
    state.categories = {
      'cat-health': { name:'Health & Fitness', color:'#10b981', icon:'💪', tasks:{} },
      'cat-work': { name:'Work & Career', color:'#3b82f6', icon:'💼', tasks:{} },
      'cat-learning': { name:'Learning', color:'#8b5cf6', icon:'📚', tasks:{} }
    };
  }
}

function saveData() {
  localStorage.setItem('eliteTrackerPro2026', JSON.stringify(state));
}

function initializeDay(date) {
  if(!state.trackedDays[date]) state.trackedDays[date] = { 
    tasks: {}, 
    habits: {},
    proud:'', 
    notes:'',
    mood: null,
    energy: null,
    productivity: null
  };
  return state.trackedDays[date];
}

// Category management
function addCategory() {
  const name = prompt('Category Name:');
  if(!name) return;
  const colors = ['#10b981','#3b82f6','#8b5cf6','#f59e0b','#ef4444','#ec4899','#6366f1'];
  const icons = ['💪','💼','📚','🎯','🎨','🏃','🧘','🎮','🍳'];
  const key = 'cat-'+Date.now();
  state.categories[key] = { 
    name, 
    color:colors[Math.floor(Math.random()*colors.length)],
    icon:icons[Math.floor(Math.random()*icons.length)],
    tasks:{} 
  };
  saveData();
  render();
}

function deleteCategory(key) {
  if(confirm('Delete category and all its tasks?')) {
    delete state.categories[key];
    for(let day in state.trackedDays){
      Object.keys(state.trackedDays[day].tasks).forEach(taskKey=>{
        if(taskKey.startsWith(key)) delete state.trackedDays[day].tasks[taskKey];
      });
    }
    saveData();
    render();
  }
}

// Task management
function addTask(catKey){
  const taskName = prompt('Task Name:');
  if(!taskName) return;
  const priority = prompt('Priority (high/medium/low):', 'medium');
  const tKey = catKey+'-task-'+Date.now();
  state.categories[catKey].tasks[tKey] = {
    name: taskName,
    priority: priority || 'medium',
    points: priority==='high'?3:(priority==='low'?1:2)
  };
  saveData();
  render();
}

function deleteTask(catKey, taskKey){
  if(confirm('Delete this task?')){
    delete state.categories[catKey].tasks[taskKey];
    for(let day in state.trackedDays){
      delete state.trackedDays[day].tasks[taskKey];
    }
    saveData();
    render();
  }
}

function toggleTask(taskKey){
  const dayData = initializeDay(state.currentDate);
  dayData.tasks[taskKey] = !dayData.tasks[taskKey];
  saveData();
  render();
}

// Habit tracking
function addHabit(){
  const name = prompt('Habit Name (e.g., "Drink 8 glasses of water"):');
  if(!name) return;
  const target = parseInt(prompt('Daily target:', '1'));
  const hKey = 'habit-'+Date.now();
  state.habits[hKey] = { name, target, icon:'⭐' };
  saveData();
  render();
}

function updateHabit(hKey, value){
  const dayData = initializeDay(state.currentDate);
  if(!dayData.habits[hKey]) dayData.habits[hKey] = 0;
  dayData.habits[hKey] = Math.max(0, dayData.habits[hKey] + value);
  saveData();
  render();
}

function deleteHabit(hKey){
  if(confirm('Delete this habit?')){
    delete state.habits[hKey];
    saveData();
    render();
  }
}

// Mood & Energy tracking
function setMood(level){
  const dayData = initializeDay(state.currentDate);
  dayData.mood = level;
  saveData();
  render();
}

function setEnergy(level){
  const dayData = initializeDay(state.currentDate);
  dayData.energy = level;
  saveData();
  render();
}

function setProductivity(level){
  const dayData = initializeDay(state.currentDate);
  dayData.productivity = level;
  saveData();
  render();
}

function updateField(field, value){
  const dayData = initializeDay(state.currentDate);
  dayData[field] = value;
  saveData();
}

// Analytics
function calculateScore(date=state.currentDate){
  const dayData = initializeDay(date);
  let points = 0;
  let total = 0;
  
  for(let catKey in state.categories){
    for(let taskKey in state.categories[catKey].tasks){
      const task = state.categories[catKey].tasks[taskKey];
      total += task.points;
      if(dayData.tasks[taskKey]) points += task.points;
    }
  }
  
  const percentage = total ? Math.round(points/total*100) : 0;
  let rating='START', emoji='💫';
  if(percentage>=20){rating='PROGRESS'; emoji='💪';}
  if(percentage>=40){rating='GOOD'; emoji='✅';}
  if(percentage>=70){rating='GREAT'; emoji='🌟';}
  if(percentage>=90){rating='ELITE'; emoji='🏆';}
  
  return {points,total,percentage,rating,emoji};
}

function getStreak(){
  let streak=0;
  for(let i=0;i<365;i++){
    const date=new Date();
    date.setDate(date.getDate()-i);
    const d=date.toISOString().split('T')[0];
    const s=calculateScore(d);
    if(s.points>0) streak++; else break;
  }
  return streak;
}

function getBestStreak(){
  let best=0, current=0;
  for(let i=364;i>=0;i--){
    const date=new Date();
    date.setDate(date.getDate()-i);
    const d=date.toISOString().split('T')[0];
    const s=calculateScore(d);
    if(s.points>0) current++; else { best=Math.max(best,current); current=0; }
  }
  return Math.max(best,current);
}

function getTotalScore(){
  let total=0;
  for(let day in state.trackedDays){
    total += calculateScore(day).points;
  }
  return total;
}

// View management
function changeView(v){
  state.view=v;
  const btns = {today:'btnToday', calendar:'btnCalendar', analytics:'btnAnalytics', insights:'btnInsights'};
  for(let view in btns){
    const btn = document.getElementById(btns[view]);
    if(view===v){
      btn.className='flex-1 px-4 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 font-semibold transition-all';
    } else {
      btn.className='flex-1 px-4 py-3 rounded-xl bg-transparent text-gray-400 font-semibold transition-all hover:bg-white/5';
    }
  }
  render();
}

function changeDate(date){
  state.currentDate=date;
  render();
}

// Export
function exportCSV(){
  let csv='Date,Category,Task,Priority,Completed,Points,Mood,Energy,Productivity,Proud,Notes\n';
  for(let date in state.trackedDays){
    const day=state.trackedDays[date];
    for(let catKey in state.categories){
      const cat=state.categories[catKey];
      for(let tKey in cat.tasks){
        const task=cat.tasks[tKey];
        csv+=`${date},"${cat.name}","${task.name}","${task.priority}",${day.tasks[tKey]?'Yes':'No'},${day.tasks[tKey]?task.points:0},${day.mood||''},${day.energy||''},${day.productivity||''},"${day.proud||''}","${day.notes||''}"\n`;
      }
    }
  }
  const blob=new Blob([csv],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`elite-tracker-${state.currentDate}.csv`;
  a.click();
}

// Render functions
function renderToday(){
  const dayData=initializeDay(state.currentDate);
  const score=calculateScore();
  
  return `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Left Column -->
      <div class="lg:col-span-2 space-y-6">
        <!-- Date & Actions -->
        <div class="glass rounded-2xl p-4 flex flex-wrap gap-4 items-center">
          <input type="date" value="${state.currentDate}" onchange="changeDate(this.value)" class="glass text-white px-4 py-2 rounded-xl border-none"/>
          <button onclick="exportCSV()" class="px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl font-semibold hover:shadow-lg transition">📊 Export</button>
          <button onclick="addCategory()" class="px-4 py-2 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-xl font-semibold hover:shadow-lg transition">➕ Category</button>
          <button onclick="addHabit()" class="px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl font-semibold hover:shadow-lg transition">⭐ Habit</button>
        </div>

        <!-- Progress Overview -->
        <div class="gradient-border">
          <div class="gradient-border-content p-6">
            <div class="flex justify-between items-center mb-4">
              <h2 class="text-2xl font-bold">Daily Progress</h2>
              <div class="text-4xl">${score.emoji}</div>
            </div>
            <div class="mb-4">
              <div class="flex justify-between text-sm mb-2">
                <span>${score.points} / ${score.total} points</span>
                <span class="font-bold text-indigo-400">${score.rating}</span>
              </div>
              <div class="w-full bg-gray-800 rounded-full h-4 overflow-hidden">
                <div class="h-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 transition-all duration-500" style="width:${score.percentage}%"></div>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-4 text-center">
              <div class="glass rounded-xl p-3">
                <p class="text-2xl font-bold text-indigo-400">${score.percentage}%</p>
                <p class="text-xs text-gray-400">Completion</p>
              </div>
              <div class="glass rounded-xl p-3">
                <p class="text-2xl font-bold text-purple-400">${score.points}</p>
                <p class="text-xs text-gray-400">Points Earned</p>
              </div>
              <div class="glass rounded-xl p-3">
                <p class="text-2xl font-bold text-pink-400">${Object.values(dayData.tasks).filter(v=>v).length}</p>
                <p class="text-xs text-gray-400">Tasks Done</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Tasks by Category -->
        ${Object.keys(state.categories).map(catKey=>{
          const cat=state.categories[catKey];
          const catTasks = Object.keys(cat.tasks);
          const completed = catTasks.filter(tk=>dayData.tasks[tk]).length;
          return `
          <div class="glass rounded-2xl p-6">
            <div class="flex justify-between items-center mb-4">
              <div class="flex items-center gap-3">
                <span class="text-3xl">${cat.icon}</span>
                <div>
                  <h3 class="text-xl font-bold">${cat.name}</h3>
                  <p class="text-sm text-gray-400">${completed}/${catTasks.length} completed</p>
                </div>
              </div>
              <div class="flex gap-2">
                <button onclick="addTask('${catKey}')" class="px-3 py-1 bg-green-500/20 text-green-400 rounded-lg text-sm hover:bg-green-500/30 transition">+ Task</button>
                <button onclick="deleteCategory('${catKey}')" class="px-3 py-1 bg-red-500/20 text-red-400 rounded-lg text-sm hover:bg-red-500/30 transition">Delete</button>
              </div>
            </div>
            <div class="space-y-2">
              ${catTasks.length>0?catTasks.map(taskKey=>{
                const task = cat.tasks[taskKey];
                const completed=dayData.tasks[taskKey]||false;
                return `<div class="glass p-3 rounded-xl flex items-center justify-between habit-pill priority-${task.priority}" onclick="toggleTask('${taskKey}')">
                  <div class="flex items-center gap-3 flex-1">
                    <input type="checkbox" class="custom-checkbox" ${completed?'checked':''} readonly onclick="event.stopPropagation()"/>
                    <span class="${completed?'line-through text-gray-400':'text-white'}">${task.name}</span>
                    <span class="text-xs px-2 py-1 rounded-full ${task.priority==='high'?'bg-red-500/20 text-red-400':task.priority==='low'?'bg-green-500/20 text-green-400':'bg-yellow-500/20 text-yellow-400'}">${task.points}pt</span>
                  </div>
                  <button onclick="event.stopPropagation();deleteTask('${catKey}','${taskKey}')" class="px-2 py-1 bg-red-500/20 text-red-400 rounded text-sm hover:bg-red-500/30">✕</button>
                </div>`;
              }).join(''):'<p class="text-gray-400 text-center py-4">No tasks yet. Add your first task!</p>'}
            </div>
          </div>`;
        }).join('')}

        <!-- Habits Tracker -->
        ${Object.keys(state.habits).length>0?`
        <div class="glass rounded-2xl p-6">
          <h3 class="text-xl font-bold mb-4">Daily Habits</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${Object.keys(state.habits).map(hKey=>{
              const habit = state.habits[hKey];
              const current = dayData.habits[hKey] || 0;
              const progress = Math.min(100, (current/habit.target)*100);
              return `
              <div class="glass p-4 rounded-xl">
                <div class="flex justify-between items-center mb-2">
                  <span class="font-semibold">${habit.icon} ${habit.name}</span>
                  <button onclick="deleteHabit('${hKey}')" class="text-red-400 text-xs hover:text-red-300">✕</button>
                </div>
                <div class="flex justify-between items-center mb-2">
                  <span class="text-sm text-gray-400">${current}/${habit.target}</span>
                  <span class="text-sm text-indigo-400">${Math.round(progress)}%</span>
                </div>
                <div class="w-full bg-gray-800 rounded-full h-2 mb-3">
                  <div class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all" style="width:${progress}%"></div>
                </div>
                <div class="flex gap-2">
                  <button onclick="updateHabit('${hKey}',-1)" class="flex-1 px-3 py-1 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition">-</button>
                  <button onclick="updateHabit('${hKey}',1)" class="flex-1 px-3 py-1 bg-green-500/20 text-green-400 rounded-lg hover:bg-green-500/30 transition">+</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>`:''}
      </div>

      <!-- Right Column -->
      <div class="space-y-6">
        <!-- Mood Tracker -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-lg font-bold mb-4">How are you feeling?</h3>
          <div class="grid grid-cols-5 gap-2">
            ${[1,2,3,4,5].map(level=>{
              const emojis=['😢','😕','😐','😊','😄'];
              return `<button onclick="setMood(${level})" class="p-3 rounded-xl ${dayData.mood===level?'bg-gradient-to-r from-indigo-500 to-purple-500 scale-110':'glass'} transition-all text-2xl hover:scale-110">${emojis[level-1]}</button>`;
            }).join('')}
          </div>
        </div>

        <!-- Energy Level -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-lg font-bold mb-4">Energy Level</h3>
          <div class="grid grid-cols-5 gap-2">
            ${[1,2,3,4,5].map(level=>{
              const emojis=['🪫','🔋','🔋','⚡','⚡'];
              return `<button onclick="setEnergy(${level})" class="p-3 rounded-xl ${dayData.energy===level?'bg-gradient-to-r from-green-500 to-emerald-500 scale-110':'glass'} transition-all text-2xl hover:scale-110">${emojis[level-1]}</button>`;
            }).join('')}
          </div>
        </div>

        <!-- Productivity -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-lg font-bold mb-4">Productivity</h3>
          <div class="grid grid-cols-5 gap-2">
            ${[1,2,3,4,5].map(level=>{
              return `<button onclick="setProductivity(${level})" class="p-3 rounded-xl ${dayData.productivity===level?'bg-gradient-to-r from-blue-500 to-cyan-500 scale-110':'glass'} transition-all text-lg hover:scale-110 font-bold">${level}⭐</button>`;
            }).join('')}
          </div>
        </div>

        <!-- Reflection -->
        <div class="glass rounded-2xl p-6">
          <h3 class="text-lg font-bold mb-4">Daily Reflection</h3>
          <div class="space-y-3">
            <div>
              <label class="text-sm text-gray-400 mb-1 block">🌟 Proud moment</label>
              <input type="text" placeholder="What made you proud today?" value="${dayData.proud||''}" oninput="updateField('proud',this.value)" class="w-full glass px-4 py-2 rounded-xl border-none"/>
            </div>
            <div>
              <label class="text-sm text-gray-400 mb-1 block">📝 Notes</label>
              <textarea placeholder="Your thoughts..." rows="4" oninput="updateField('notes',this.value)" class="w-full glass px-4 py-2 rounded-xl border-none resize-none">${dayData.notes||''}</textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function getLocalDateString(date = new Date()) {
  const offset = date.getTimezoneOffset();
  const local = new Date(date.getTime() - offset * 60000);
  return local.toISOString().split('T')[0];
}


function renderCalendar(){
  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startingDayOfWeek = firstDay.getDay();
  
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  
  let calendar = `
    <div class="glass rounded-2xl p-6">
      <div class="flex justify-between items-center mb-6">
        <button onclick="changeMonth(-1)" class="px-4 py-2 glass rounded-xl hover:bg-white/10 transition">←</button>
        <h2 class="text-2xl font-bold text-center">${monthNames[month]} ${year}</h2>
        <button onclick="changeMonth(1)" class="px-4 py-2 glass rounded-xl hover:bg-white/10 transition">→</button>
      </div>
      <div class="grid grid-cols-7 gap-2 mb-2">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(day=>`<div class="text-center text-gray-400 font-semibold py-2">${day}</div>`).join('')}
      </div>
      <div class="grid grid-cols-7 gap-2">
  `;
  
  for(let i=0; i<startingDayOfWeek; i++){
    calendar += `<div class="aspect-square"></div>`;
  }
  
  for(let day=1; day<=daysInMonth; day++){
    const date = new Date(year, month, day);
    const dateStr = getLocalDateString(date)
    const score = calculateScore(dateStr);
    const isToday = dateStr === state.currentDate;
    
    let colorClass = 'glass';
    if(score.percentage >= 90) colorClass = 'bg-gradient-to-br from-green-500/30 to-emerald-500/30 border border-green-500/50';
    else if(score.percentage >= 70) colorClass = 'bg-gradient-to-br from-blue-500/30 to-cyan-500/30 border border-blue-500/50';
    else if(score.percentage >= 40) colorClass = 'bg-gradient-to-br from-yellow-500/30 to-orange-500/30 border border-yellow-500/50';
    else if(score.percentage > 0) colorClass = 'bg-gradient-to-br from-red-500/30 to-pink-500/30 border border-red-500/50';
    
    calendar += `
      <div onclick="changeDate('${dateStr}')" class="aspect-square ${colorClass} rounded-xl p-2 cursor-pointer hover:scale-105 transition-all ${isToday?'ring-2 ring-indigo-500':''}">
        <div class="text-sm font-bold ${isToday?'text-indigo-400':''}">${day}</div>
        ${score.points>0?`<div class="text-xs text-gray-400 mt-1">${score.points}pt</div>`:''}
        ${score.percentage>0?`<div class="text-xs text-gray-400">${score.percentage}%</div>`:''}
      </div>
    `;
  }
  
  calendar += `
      </div>
      <div class="mt-6 grid grid-cols-2 md:grid-cols-4 gap-4">
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-gradient-to-br from-green-500/30 to-emerald-500/30 rounded"></div>
                    <span class="text-gray-400">Elite (90%+)</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-gradient-to-br from-blue-500/30 to-cyan-500/30 rounded"></div>
          <span class="text-gray-400">Great (70%+)</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-gradient-to-br from-yellow-500/30 to-orange-500/30 rounded"></div>
          <span class="text-gray-400">Good (40%+)</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-4 h-4 bg-gradient-to-br from-red-500/30 to-pink-500/30 rounded"></div>
          <span class="text-gray-400">Started</span>
        </div>
      </div>
    </div>
  `;
  
  return calendar;
}

let calendarOffset = 0;
function changeMonth(delta){
  calendarOffset += delta;
  render();
}

function renderAnalytics(){
  return `
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="glass rounded-2xl p-6">
        <h3 class="text-xl font-bold mb-4">Performance Overview</h3>
        <canvas id="scoreChart" height="200"></canvas>
      </div>
      <div class="glass rounded-2xl p-6">
        <h3 class="text-xl font-bold mb-4">Mood vs Productivity</h3>
        <canvas id="moodChart" height="200"></canvas>
      </div>
    </div>
  `;
}

function renderInsights(){
  const streak = getStreak();
  const best = getBestStreak();
  const total = getTotalScore();

  return `
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="glass rounded-2xl p-6 text-center">
        <p class="text-sm text-gray-400">Current Streak</p>
        <p class="text-5xl font-bold text-indigo-400 mt-2">${streak}</p>
        <p class="text-gray-400 mt-1">days 🔥</p>
      </div>
      <div class="glass rounded-2xl p-6 text-center">
        <p class="text-sm text-gray-400">Best Streak</p>
        <p class="text-5xl font-bold text-purple-400 mt-2">${best}</p>
        <p class="text-gray-400 mt-1">days 🏆</p>
      </div>
      <div class="glass rounded-2xl p-6 text-center">
        <p class="text-sm text-gray-400">Lifetime Score</p>
        <p class="text-5xl font-bold text-pink-400 mt-2">${total}</p>
        <p class="text-gray-400 mt-1">points ⭐</p>
      </div>

      <div class="glass rounded-2xl p-6 md:col-span-3">
        <h3 class="text-xl font-bold mb-4">Elite Insight</h3>
        <p class="text-gray-300 leading-relaxed">
          Consistency beats intensity. Your highest-performing days correlate with
          completing <span class="text-indigo-400 font-semibold">high-priority tasks early</span>
          and maintaining stable energy levels. Protect your mornings.
        </p>
      </div>
    </div>
  `;
}

function render(){
  document.getElementById('streak').textContent = getStreak();
  document.getElementById('bestStreak').textContent = getBestStreak();
  document.getElementById('totalScore').textContent = getTotalScore();

  let content = '';
  if(state.view === 'today') content = renderToday();
  if(state.view === 'calendar') content = renderCalendar();
  if(state.view === 'analytics') content = renderAnalytics();
  if(state.view === 'insights') content = renderInsights();

  document.getElementById('app').innerHTML = content;

  if(state.view === 'analytics'){
    renderCharts();
  }
}

function renderCharts(){
  const labels = [];
  const scores = [];
  const moods = [];
  const productivity = [];

  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const date = d.toISOString().split('T')[0];
    const score = calculateScore(date);
    const day = state.trackedDays[date] || {};

    labels.push(date.slice(5));
    scores.push(score.percentage);
    moods.push(day.mood || 0);
    productivity.push(day.productivity || 0);
  }

  new Chart(document.getElementById('scoreChart'),{
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'Completion %',
        data:scores,
        borderColor:'#6366f1',
        backgroundColor:'rgba(99,102,241,0.2)',
        fill:true,
        tension:0.4
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{y:{min:0,max:100}}
    }
  });

  new Chart(document.getElementById('moodChart'),{
    type:'bar',
    data:{
      labels,
      datasets:[
        { label:'Mood', data:moods, backgroundColor:'#8b5cf6' },
        { label:'Productivity', data:productivity, backgroundColor:'#06b6d4' }
      ]
    },
    options:{
      plugins:{legend:{position:'bottom'}},
      scales:{y:{min:0,max:5}}
    }
  });
}

// Init
loadData();
initializeDay(state.currentDate);
render();
</script>

</body>
